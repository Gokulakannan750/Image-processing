<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriBot Vision Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --text: #c9d1d9;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; font-weight: 600; }
    #uptime-badge { margin-left: auto; font-size: 12px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: minmax(0,2fr) minmax(0,1fr);
      gap: 16px;
      padding: 16px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 12px;
    }
    /* Video */
    #video-card { grid-column: 1; grid-row: 1 / 3; }
    #video-card img {
      width: 100%;
      border-radius: 4px;
      background: #000;
      display: block;
      min-height: 360px;
      object-fit: cover;
    }
    /* Stats */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--bg); border-radius: 6px; padding: 10px 12px; }
    .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .state-DRIVING   { color: var(--green); }
    .state-TURNING   { color: var(--yellow); }
    .state-STOPPED   { color: var(--red); }
    .state-RECOVERING{ color: var(--yellow); }
    .state-IDLE      { color: var(--muted); }
    /* Obstacles */
    #obstacle-list { list-style: none; }
    #obstacle-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    #obstacle-list li:last-child { border-bottom: none; }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: 600; }
    .badge-critical { background: #f8514933; color: var(--red); }
    .badge-safe     { background: #3fb95033; color: var(--green); }
    #no-obstacles   { color: var(--muted); font-size: 13px; }
    /* Chart */
    #chart-card { grid-column: 1; }
    canvas { width: 100% !important; }
    /* Logs */
    #log-card { grid-column: 2; grid-row: 1 / 4; }
    #log-box {
      height: 520px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      background: var(--bg);
      border-radius: 4px;
      padding: 8px;
      line-height: 1.6;
    }
    .log-entry { color: var(--muted); }
    .log-entry .ts { color: var(--accent); margin-right: 6px; }
    .estop-line { color: var(--red); font-weight: bold; }
    /* Dot */
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-green  { background: var(--green); }
    .dot-red    { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .dot-yellow { background: var(--yellow); }
  </style>
</head>
<body>
<header>
  <span class="dot dot-green" id="conn-dot"></span>
  <h1>AgriBot Vision Dashboard</h1>
  <span id="uptime-badge">Uptime: —</span>
</header>

<div class="grid">
  <!-- Live Video -->
  <div class="card" id="video-card">
    <h2>Live Camera Feed</h2>
    <img src="/video" alt="Live feed" id="live-img" />
  </div>

  <!-- Status -->
  <div class="card">
    <h2>System Status</h2>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Vehicle State</div><div class="stat-value" id="st-state">—</div></div>
      <div class="stat"><div class="stat-label">FPS</div><div class="stat-value" id="st-fps">—</div></div>
      <div class="stat"><div class="stat-label">Latency</div><div class="stat-value" id="st-latency">—</div></div>
      <div class="stat"><div class="stat-label">Steering</div><div class="stat-value" id="st-steering">—</div></div>
      <div class="stat"><div class="stat-label">Target</div><div class="stat-value" id="st-target">—</div></div>
      <div class="stat"><div class="stat-label">Distance</div><div class="stat-value" id="st-dist">—</div></div>
    </div>
  </div>

  <!-- Obstacles -->
  <div class="card">
    <h2>Detected Obstacles</h2>
    <p id="no-obstacles">None detected</p>
    <ul id="obstacle-list"></ul>
  </div>

  <!-- Logs -->
  <div class="card" id="log-card">
    <h2>System Log</h2>
    <div id="log-box"></div>
  </div>

  <!-- History chart -->
  <div class="card" id="chart-card">
    <h2>FPS &amp; Latency History (last 60 s)</h2>
    <canvas id="hist-chart" height="160"></canvas>
  </div>
</div>

<script>
  // ── Minimal chart (no external deps) ──────────────────────────────────────
  const canvas = document.getElementById('hist-chart');
  const ctx = canvas.getContext('2d');
  const MAX_PTS = 60;
  const fpsHist = [], latHist = [];

  function drawChart() {
    const W = canvas.offsetWidth, H = canvas.offsetHeight || 160;
    canvas.width = W; canvas.height = H;
    ctx.clearRect(0, 0, W, H);
    const pad = { t:10, r:10, b:24, l:40 };
    const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (cH/4)*i;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    }
    function line(data, maxV, color) {
      if (data.length < 2) return;
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      data.forEach((v,i) => {
        const x = pad.l + (i/(MAX_PTS-1))*cW;
        const y = pad.t + cH - Math.min(v/maxV,1)*cH;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      });
      ctx.stroke();
    }
    line(fpsHist, 60,  '#58a6ff');
    line(latHist, 200, '#3fb950');
    ctx.fillStyle='#8b949e'; ctx.font='11px Segoe UI';
    ctx.textAlign='right';
    ctx.fillText('60 fps', pad.l-4, pad.t+8);
    ctx.fillText('0',      pad.l-4, pad.t+cH);
    ctx.textAlign='left';
    ctx.fillStyle='#58a6ff'; ctx.fillText('● FPS',          pad.l,    H-4);
    ctx.fillStyle='#3fb950'; ctx.fillText('● Latency ms/200', pad.l+60, H-4);
  }

  // ── Status polling ─────────────────────────────────────────────────────────
  function fmtUptime(s) {
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    return [h,m,sec].map(n=>String(n).padStart(2,'0')).join(':');
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function pollStatus() {
    try {
      const d = await fetch('/status').then(r=>r.json());
      document.getElementById('st-state').textContent   = d.state;
      document.getElementById('st-state').className     = `stat-value state-${d.state}`;
      document.getElementById('st-fps').textContent     = d.fps;
      document.getElementById('st-latency').textContent = d.latency_ms + ' ms';
      document.getElementById('st-steering').textContent= d.steering > 0 ? `+${d.steering}` : d.steering;
      document.getElementById('st-target').textContent  = d.has_target ? '✔ Locked' : '— None';
      document.getElementById('st-dist').textContent    = d.target_distance_m != null ? `${d.target_distance_m} m` : '—';
      document.getElementById('uptime-badge').textContent = 'Uptime: ' + fmtUptime(d.uptime_s);
      document.getElementById('conn-dot').className =
        d.state==='STOPPED' ? 'dot dot-red' : d.state==='TURNING' ? 'dot dot-yellow' : 'dot dot-green';

      const list = document.getElementById('obstacle-list');
      list.innerHTML = '';
      if (d.obstacles && d.obstacles.length > 0) {
        document.getElementById('no-obstacles').style.display = 'none';
        d.obstacles.forEach(o => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${esc(o.label)} (${o.confidence}%)</span>
            <span class="badge ${o.critical ? 'badge-critical':'badge-safe'}">${o.critical?'CRITICAL':'safe'}</span>`;
          list.appendChild(li);
        });
      } else {
        document.getElementById('no-obstacles').style.display = '';
      }

      fpsHist.push(d.fps); latHist.push(d.latency_ms);
      if (fpsHist.length > MAX_PTS) fpsHist.shift();
      if (latHist.length > MAX_PTS) latHist.shift();
      drawChart();
    } catch { document.getElementById('conn-dot').className = 'dot dot-red'; }
  }

  // ── Log polling ────────────────────────────────────────────────────────────
  const logBox = document.getElementById('log-box');
  let lastCount = 0;
  async function pollLogs() {
    try {
      const logs = await fetch('/logs').then(r=>r.json());
      if (logs.length === lastCount) return;
      lastCount = logs.length;
      logBox.innerHTML = logs.map(l => {
        const cls = /E-STOP|CRITICAL/.test(l.msg) ? 'log-entry estop-line' : 'log-entry';
        return `<div class="${cls}"><span class="ts">${l.t}</span>${esc(l.msg)}</div>`;
      }).join('');
      logBox.scrollTop = logBox.scrollHeight;
    } catch {}
  }

  setInterval(pollStatus, 500);
  setInterval(pollLogs,  1000);
  pollStatus(); pollLogs();
</script>
</body>
</html>
