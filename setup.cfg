[mypy]
# Treat the repo root as the package root — prevents modules from being
# discovered twice under different names (e.g. testing.environment_modes vs
# environment_modules) when mypy walks the directory tree.
mypy_path = .
ignore_missing_imports = True
exclude = scratch/
# Pydantic plugin: teaches mypy about Field(default_factory=...) and validators
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = False
init_typed = True
warn_required_dynamic_aliases = False

[flake8]
max-line-length = 88
extend-ignore =
    # E203: whitespace before ':' — conflicts with black's slice formatting
    E203,
    # W503: line break before binary operator — conflicts with black
    W503,
    # E501: line too long — black enforces 88 chars; residual over-length lines
    #       are in docstrings/comments that black doesn't reformat
    E501,
    # E221: multiple spaces before operator — allows aligned constant blocks
    E221
exclude =
    __pycache__,
    .git,
    scratch,
    logs,
    recordings
