# Orchard test configuration
# ===========================
# Markerless ORCHARD navigation + obstacle detection, for testing on video.
#   - orchard follower ON  (steer the grassy alley, detect row ends)
#   - YOLO obstacle detection ON  (person / vehicle / animal -> STOP)
#   - ArUco / pole / barcode / feature OFF (no markers in this field)
#
# Run:
#   python main.py --video <your_video.mp4> --config config/orchard.yaml
# or drag a video onto tools/Test_Orchard_Video.bat

robot_id: "orchard-test"

camera:
  index: 0
  loop_video: true
  width: 1280
  height: 720
  fps: 30

detectors:
  aruco:
    enabled: false
  barcode:
    enabled: false
  feature:
    enabled: false
  pole:
    enabled: false
  row_follower:
    enabled: false
  orchard:
    enabled: true
    work_width: 320
    green_exg_min: 0.02
    tree_texture_pct: 52
    tree_texture_abs_min: 6.0
    near_band_top: 0.60
    near_band_bottom: 0.92
    lookahead_top: 0.45
    lookahead_bottom: 0.65
    scan_top: 0.45
    scan_bottom: 0.92
    ema_alpha: 0.4
    rowend_wall_min: 0.25
    rowend_frames: 6
  yolo:
    enabled: true          # obstacle detection
    model: "yolov8n.pt"
    confidence: 0.40        # min confidence to report an obstacle
    danger_zone_ratio: 0.12 # obstacle bbox >= 12% of frame -> STOP
    device: "cpu"
    # Only obstacles in the PATH AHEAD (central corridor) trigger a STOP.
    # Roadside people/bikes are still detected (orange) but don't stop us.
    roi_enabled: true
    roi_half_width: 0.28    # central +/-28% of width = the alley corridor
    roi_top: 0.40           # ignore the far/top of the frame
    roi_bottom: 1.0
    # People & animals in the path STOP the machine even when far/small.
    priority_classes: ["person", "cat", "dog", "horse", "sheep", "cow"]
    priority_min_ratio: 0.015  # >=1.5% of frame (much smaller than 12%)
  ground_obstacle:
    # GENERIC obstacle detector — stops for ANY object in the alley, even ones
    # YOLO cannot name (bags, crates, rocks, branches). Learns the grass/soil
    # ground ahead and flags anything that doesn't match.
    enabled: true
    work_width: 320
    roi_half_width: 0.30     # central corridor (the alley ahead)
    eval_top: 0.60           # look for objects from here ...
    eval_bottom: 0.90        # ... down to just above the machine
    ref_top: 0.80            # learn "ground" from this near band
    ref_bottom: 0.98
    hist_bins: 24
    min_ground_prob: 0.001   # colour rarer than this in ground = anomaly
    dark_margin: 28.0        # also flag patches this much darker than ground
    achroma_max: 4.0         # flag near-grey patches (rock/concrete/box)
    min_area_frac: 0.008     # blob this big (of corridor) = report it
    stop_area_frac: 0.020    # blob this big = STOP
    solidity_min: 0.45       # reject scattered grass speckle
    confirm_frames: 2        # consecutive hits before stopping

navigation:
  turn_cooldown_s: 10.0
  smoothing_alpha: 0.3
  dead_zone_x: 20
  recovery_timeout_s: 2.0
  min_state_duration_s: 0.5

safety:
  max_stale_frame_ms: 1500
  enable_auto_recovery: true

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 5000

recording:
  enabled: false
