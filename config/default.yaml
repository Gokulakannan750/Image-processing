# Professional Robotics Framework Configuration

robot_id: "robot-0"   # Unique identifier — change per machine in a fleet

camera:
  index: 0
  # source overrides index — set to a device index (int), a VIDEO FILE path,
  # or a stream URL (string).
  # Examples:
  #   source: 0                               # built-in webcam
  #   source: "recordings/field_walk.mp4"     # PRE-RECORDED VIDEO FILE
  #   source: "http://192.168.1.5:8080/video" # IP Webcam Android app
  #   source: "http://192.168.1.5:4747/video" # DroidCam Android/iOS
  # source: "recordings/field_walk.mp4"
  loop_video: true   # when source is a video file, repeat it on end
  width: 1280
  height: 720
  fps: 30
  timeout_s: 2.0
  max_reconnect_attempts: 5
  reconnect_delay_s: 1.0

detectors:
  # NEW ARCHITECTURE: a red 1-metre pole at each row end is detected by the
  # 'pole' detector below (no printed ArUco/QR/barcode needed). To use poles
  # ONLY, set aruco.enabled: false. They can also run together.
  aruco:
    enabled: true
    dictionary: "DICT_6X6_250"
    downsample_width: 1280
    show_rejected: false
    marker_length_m: 0.20
    turn_trigger_distance_m: 1.5
    camera_matrix: [[800, 0, 640], [0, 800, 360], [0, 0, 1]]
    dist_coeffs: [[0, 0, 0, 0]]
  pole:
    enabled: true                 # detect red 1 m poles at row ends
    width_m: 0.10                 # real pole width (m) for distance estimate
    turn_trigger_distance_m: 1.5  # fire the U-turn at this distance
    # HSV colour range for red (red wraps the hue cylinder, so two ranges):
    hsv_lower1: [0, 100, 100]
    hsv_upper1: [10, 255, 255]
    hsv_lower2: [160, 100, 100]
    hsv_upper2: [180, 255, 255]
  row_follower:
    # MARKERLESS navigation for LOW crop rows (bare-soil path between green rows).
    # For ORCHARDS (grassy alley between tree walls) use 'orchard' below instead.
    enabled: false
    exg_threshold: 0.10           # Excess-Green threshold for "this is a plant"
    near_band_top: 0.55           # steering band (fractions of image height)
    near_band_bottom: 0.95
    far_band_top: 0.30            # row-end look-ahead band
    far_band_bottom: 0.50
    rowend_veg_min: 0.04          # crop coverage below this ahead = row ended
    rowend_frames: 5              # consecutive low-crop frames to confirm end
    path_veg_frac: 0.35           # column < this fraction of peak veg = soil path
  orchard:
    # MARKERLESS ORCHARD follower (validated on real apple-orchard video).
    # Finds the grassy alley as the gap between the dark, TEXTURED tree walls.
    # Use this for orchards/vineyards; turn aruco/pole/row_follower OFF.
    enabled: false
    work_width: 320               # downsample width for speed
    green_exg_min: 0.02           # min greenness to be considered foliage
    tree_texture_pct: 52          # texture percentile above which = tree wall
    tree_texture_abs_min: 6.0     # absolute texture floor (smooth field != wall)
    near_band_top: 0.60           # steering band (fractions of image height)
    near_band_bottom: 0.92
    lookahead_top: 0.45           # row-end look-ahead band
    lookahead_bottom: 0.65
    scan_top: 0.45                # vertical scan range for the centreline
    scan_bottom: 0.92
    ema_alpha: 0.4                # output centre smoothing (0=smooth,1=instant)
    rowend_wall_min: 0.25         # <this fraction of look-ahead rows w/ both
                                  # walls => row ending
    rowend_frames: 6              # consecutive frames to confirm row end
  barcode:
    enabled: false
    min_pixel_area: 20000
  feature:
    enabled: false
    min_matches: 15
    match_distance_threshold: 50
  yolo:
    enabled: true
    model: "yolov8n.pt"        # downloaded automatically on first run
    confidence: 0.50           # minimum detection confidence
    danger_zone_ratio: 0.12    # bbox/frame area fraction that triggers E-STOP
    device: "cpu"              # "cpu", "cuda", or "mps"
    # Path-ahead STOP zone: only obstacles whose centre is in this central
    # corridor (and big enough) trigger a STOP. Roadside obstacles are still
    # detected but won't stop the machine. Set roi_enabled:false for whole-frame.
    roi_enabled: true
    roi_half_width: 0.28       # central +/-28% of frame width
    roi_top: 0.40              # ignore far/top of the frame
    roi_bottom: 1.0

navigation:
  turn_cooldown_s: 10.0
  max_cross_track_error_m: 0.5
  max_heading_error_deg: 15.0
  smoothing_alpha: 0.3
  dead_zone_x: 20
  recovery_timeout_s: 2.0
  min_state_duration_s: 0.5

controller:
  can_interface: "virtual"
  can_channel: "can0"
  can_bitrate: 500000
  turn_command_id: 291
  turn_command_data: [1, 0, 0, 0, 0, 0, 0, 0]
  estop_command_id: 0          # Arbitration ID 0x000 — highest CAN priority
  estop_command_data: [255, 255, 0, 0, 0, 0, 0, 0]

safety:
  max_stale_frame_ms: 1500
  enable_auto_recovery: true
  min_fps_warning: 5.0

recording:
  enabled: false
  output_dir: "recordings"
  save_raw_frames: true
  save_annotated_frames: true
  save_metadata_json: true

validation:
  pose_stability_threshold: 0.8
  jitter_warning_m: 0.05
  min_confidence: 0.6
  enable_stability_overlay: true

normalization:
  enabled: true
  method: "CLAHE"
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]
  gamma_correction: 1.2

testing:
  active_mode: "NORMAL"
  draw_mode_overlay: true

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 5000

row_tracker:
  # How marker IDs map to row numbers. Options:
  #   "simple"     — marker ID = row number  (ID 1 → Row 1, ID 2 → Row 2 …)
  #   "dual"       — even IDs are top ends, odd IDs are bottom ends
  #                  (ID 0 → Row 1 top, ID 1 → Row 1 bottom, ID 2 → Row 2 top …)
  #   "barcode"    — barcode/QR text encodes the row (e.g. "ROW-3", "3", "ROW3-TOP")
  #                  Special texts: "LAST-ROW" triggers final turn; "STOP" halts the field
  #   "custom_map" — explicit mapping in id_map below
  scheme: "simple"

  # Total number of rows in the field. Set to 0 if using LAST_ROW/STOP markers instead.
  total_rows: 0

  # ── Special end-of-field markers ─────────────────────────────────────────
  # ArUco marker ID that means "this is the last row — turn here, then stop at next marker"
  # Set to -1 to disable (use barcode text "LAST-ROW" instead)
  last_row_marker_id: 249

  # ArUco marker ID that means "stop here — field is complete, no more turns"
  # Set to -1 to disable (use barcode text "STOP" instead)
  stop_marker_id: 248

  # Used only when scheme = "custom_map"
  # Format:  marker_id: row_number
  # Example: {0: 1, 5: 2, 10: 3}
  id_map: {}

debug:
  visualize_commands: true
  draw_pose_axes: true
  show_performance: true
  show_latency_graph: true
  draw_path_history: true
  history_maxlen: 30
